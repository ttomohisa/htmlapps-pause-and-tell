name: Insertion mode PoC (offline composition)
on:
  pull_request:
    branches:
      - main
    paths:
      - 'experiments/insertion-poc/**'
      - '.github/workflows/insertion-poc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  insertion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies and generate offline PoC
        working-directory: experiments/insertion-poc
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --no-save
          npm run build
          test -f dist/index.html
          if grep -q '__INSERTION_POC_BUNDLE__' dist/index.html; then exit 1; fi
          if grep -Eq '<script[^>]+src=' dist/index.html; then exit 1; fi
      - name: Test dependencies for local Chromium
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.58.0'
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          test -x /usr/bin/chromium
          ffprobe -version | head -n 1
      - name: Run offline media composition regression
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory experiments/insertion-poc/dist >/tmp/insertion-http.log 2>&1 &
          python experiments/insertion-poc/test-smoke.py --url http://127.0.0.1:8765/index.html --out insertion-evidence
      - name: Archive PoC output and inspection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: insertion-poc-evidence
          path: insertion-evidence/
          if-no-files-found: ignore
          retention-days: 7
