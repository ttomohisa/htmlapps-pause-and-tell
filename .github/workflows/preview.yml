name: Deploy PR preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: "4.135.0"

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Build experimental insertion PoC for PR preview only
        shell: pwsh
        run: |
          $normalHash = (Get-FileHash ./dist/index.html -Algorithm SHA256).Hash
          Push-Location ./experiments/insertion-poc
          try {
            npm install --ignore-scripts --no-audit --no-fund --no-package-lock --no-save
            if ($LASTEXITCODE -ne 0) { throw "PoC dependency install failed." }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "PoC build failed." }
            node build-native-sample.mjs
            if ($LASTEXITCODE -ne 0) { throw "Native diagnostic build failed." }
          } finally { Pop-Location }
          New-Item -ItemType Directory -Force ./dist/insertion-poc | Out-Null
          Copy-Item ./experiments/insertion-poc/dist/index.html ./dist/insertion-poc/index.html
          New-Item -ItemType Directory -Force ./dist/insertion-poc/native-mp4 | Out-Null
          Copy-Item ./experiments/insertion-poc/dist/native-mp4.html ./dist/insertion-poc/native-mp4/index.html
          node ./experiments/insertion-poc/test-preview-modes.mjs
          if ($LASTEXITCODE -ne 0) { throw "Mode guide regression failed." }
          node ./experiments/insertion-poc/prepare-preview-modes.mjs ./dist
          if ($LASTEXITCODE -ne 0) { throw "Mode guide staging failed." }
          if ((Get-FileHash ./dist/index.html -Algorithm SHA256).Hash -ne $normalHash) {
            throw "Normal app changed while preparing PoC preview."
          }
          $poc = Get-Content -Raw ./dist/insertion-poc/index.html
          if ($poc -notmatch 'noindex,nofollow' -or $poc -notmatch 'Insertion PoC') {
            throw "PoC preview lacks experiment or noindex marker."
          }

      - name: Check Cloudflare preview credentials
        id: cloudflare
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -and
            -not [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)

          "configured=$($configured.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if (-not $configured) {
            Write-Host "::notice::Cloudflare PR Preview skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
          }

      - name: Create or update Cloudflare Preview
        id: preview
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $env:CLOUDFLARE_API_TOKEN = $env:CLOUDFLARE_API_TOKEN.Trim()
          $env:CLOUDFLARE_ACCOUNT_ID = $env:CLOUDFLARE_ACCOUNT_ID.Trim()
          $env:NO_COLOR = "1"

          if ($env:CLOUDFLARE_ACCOUNT_ID -notmatch '^[A-Za-z0-9_-]+$') {
            throw "CLOUDFLARE_ACCOUNT_ID contains invalid characters. Save only the Account ID value in the GitHub secret, without quotes or extra text."
          }

          $previewName = "r${{ github.event.repository.id }}-pr-${{ github.event.pull_request.number }}"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "wrangler-preview.json"
          $stderrPath = Join-Path $env:RUNNER_TEMP "wrangler-preview.stderr.log"

          Write-Host "Preview name: $previewName"

          $arguments = @(
            "--yes"
            "wrangler@$env:WRANGLER_VERSION"
            "preview"
            "--config"
            "wrangler.preview.jsonc"
            "--name"
            $previewName
            "--json"
          )

          $process = Start-Process -FilePath "npx.cmd" `
            -ArgumentList $arguments `
            -NoNewWindow `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath

          if (Test-Path $stderrPath) {
            $stderrText = Get-Content -Raw -Encoding UTF8 $stderrPath
            if (-not [string]::IsNullOrWhiteSpace($stderrText)) {
              Write-Host $stderrText
            }
          }

          if ($process.ExitCode -ne 0) {
            throw "Cloudflare Preview deployment failed with exit code $($process.ExitCode)."
          }

          $stdoutBytes = [System.IO.File]::ReadAllBytes($stdoutPath)

          if ($stdoutBytes.Length -ge 2 -and $stdoutBytes[0] -eq 0xFF -and $stdoutBytes[1] -eq 0xFE) {
            $jsonText = [System.Text.Encoding]::Unicode.GetString($stdoutBytes)
          } elseif ($stdoutBytes.Length -ge 2 -and $stdoutBytes[0] -eq 0xFE -and $stdoutBytes[1] -eq 0xFF) {
            $jsonText = [System.Text.Encoding]::BigEndianUnicode.GetString($stdoutBytes)
          } else {
            $jsonText = [System.Text.Encoding]::UTF8.GetString($stdoutBytes)
          }

          $jsonStart = $jsonText.IndexOf('{')
          $jsonEnd = $jsonText.LastIndexOf('}')

          if ($jsonStart -lt 0 -or $jsonEnd -lt $jsonStart) {
            throw "Wrangler completed successfully but did not return a JSON object."
          }

          $jsonText = $jsonText.Substring($jsonStart, $jsonEnd - $jsonStart + 1)
          $result = $jsonText | ConvertFrom-Json
          $previewUrl = [string]$result.preview.urls[0]

          if ([string]::IsNullOrWhiteSpace($previewUrl)) {
            throw "Wrangler did not return a Preview URL."
          }

          "preview_url=$previewUrl" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "preview_name=$previewName" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Preview URL: $previewUrl"

      - name: Probe Preview
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          $lastError = $null

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $env:PREVIEW_URL -MaximumRedirection 5 -TimeoutSec 30

              if ($response.StatusCode -eq 200) {
                $pocUrl = $env:PREVIEW_URL.TrimEnd('/') + '/insertion-poc/'
                $poc = Invoke-WebRequest -Uri $pocUrl -MaximumRedirection 5 -TimeoutSec 30
                if ($poc.StatusCode -ne 200 -or $poc.Content -notmatch 'Insertion PoC' -or $poc.Content -notmatch 'noindex,nofollow') {
                  throw "Insertion PoC preview route is missing or serves the wrong page."
                }
                $native = Invoke-WebRequest -Uri ($pocUrl + 'native-mp4/') -MaximumRedirection 5 -TimeoutSec 30
                if ($native.StatusCode -ne 200 -or $native.Content -notmatch 'Native MP4 laboratory' -or $native.Content -notmatch 'noindex,nofollow') {
                  throw "Native diagnostic preview is missing or wrong."
                }
                $modes = Invoke-WebRequest -Uri ($env:PREVIEW_URL.TrimEnd('/') + '/modes/') -MaximumRedirection 5 -TimeoutSec 30
                if ($modes.StatusCode -ne 200 -or $modes.Content -notmatch 'Choose a mode' -or $modes.Content -notmatch 'noindex,nofollow') {
                  throw "Mode guide preview is missing or wrong."
                }
                Write-Host "Normal, insertion, mode guide and native diagnostic previews returned HTTP 200."
                exit 0
              }

              $lastError = "HTTP $($response.StatusCode)"
            } catch {
              $lastError = $_.Exception.Message
            }

            Write-Host "Preview is not ready yet (attempt $attempt/12): $lastError"
            Start-Sleep -Seconds 5
          }

          throw "Preview did not become ready: $lastError"

      - name: Comment Preview URL
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_NAME: ${{ steps.preview.outputs.preview_name }}
        run: |
          $pocUrl = $env:PREVIEW_URL.TrimEnd('/') + '/insertion-poc/'
          $body = @"
          ## Browser Kitty PR Preview

          **[モードを選ぶ / Choose a mode]($($env:PREVIEW_URL.TrimEnd('/') + '/modes/'))**

          **[通常版を開く]($env:PREVIEW_URL)**

          **[差し込みPoCを開く（Draft・実験版）]($pocUrl)**

          **[Native MP4 合成2秒テスト（Draft）]($($pocUrl + 'native-mp4/'))**

          - Preview: ``$env:PREVIEW_NAME``
          - Commit: ``${{ github.event.pull_request.head.sha }}``
          - Hosting: Cloudflare Workers Preview

          このPRへ追加でpushすると同じPreview URLが最新版へ更新されます。PRを閉じるとPreviewは自動削除されます。
          "@

          gh pr comment "${{ github.event.pull_request.number }}" `
            --body $body `
            --edit-last `
            --create-if-none
