name: Native MP4 insertion milestone (Windows, opt-in)
on:
  pull_request:
    types: [edited]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
concurrency:
  group: native-mp4-milestone-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ contains(github.event.pull_request.title, '[run-native-mp4]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build unchanged-CSP app and prepare browser
        shell: pwsh
        run: |
          Set-Location experiments/insertion-poc
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --no-save
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'App build failed' }
          python -m pip install --disable-pip-version-check playwright==1.58.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          $chrome = Join-Path ${env:ProgramFiles} 'Google/Chrome/Application/chrome.exe'
          if (!(Test-Path $chrome)) { throw 'Preinstalled Google Chrome unavailable' }
          "CHROME=$chrome" >> $env:GITHUB_ENV
      - name: Query actual native candidates (unsupported is not media success)
        id: native
        shell: pwsh
        run: python experiments/insertion-poc/run-local-media-test.py test-native-gate.py --chromium "$env:CHROME" --out native-mp4-evidence
      - name: Prepare independent media inspection
        if: steps.native.outputs.ready == 'true'
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg test dependency unavailable' }
          }
          ffmpeg -version
          ffprobe -version
      - name: Encode VFR 44.1kHz stereo with two inserts to native MP4
        if: steps.native.outputs.ready == 'true'
        shell: pwsh
        run: |
          python experiments/insertion-poc/run-local-media-test.py test-smoke.py --chromium "$env:CHROME" --output-format mp4 --vfr-stereo --multiple --out native-mp4-evidence/vfr-two-inserts
          if ($LASTEXITCODE -ne 0) { throw 'Native MP4 media verification failed' }
      - name: Verify last-good native MP4 after failed re-export
        if: steps.native.outputs.ready == 'true'
        shell: pwsh
        run: python experiments/insertion-poc/run-local-media-test.py test-resilience.py --chromium "$env:CHROME" --case failed_export --output-format mp4 --out native-mp4-evidence/failure-protection
      - name: Verify silent native MP4 and source audio resumption
        if: steps.native.outputs.ready == 'true'
        shell: pwsh
        run: python experiments/insertion-poc/run-local-media-test.py test-resilience.py --chromium "$env:CHROME" --case silent_explanations --output-format mp4 --out native-mp4-evidence/silent-explanations
      - name: Preserve bounded milestone evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-mp4-windows-milestone
          path: native-mp4-evidence/
          retention-days: 7
          if-no-files-found: ignore
