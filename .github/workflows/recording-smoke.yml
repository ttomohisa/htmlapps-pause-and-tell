name: Pause & Tell browser recording smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/recording-smoke.yml'
      - 'tests/recording-ux-smoke.py'
      - 'tests/g9-browser-regression.py'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Expose Unix tar for the Windows-origin build script
        shell: bash
        run: |
          ln -s "$(command -v tar)" "$RUNNER_TEMP/tar.exe"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build single HTML (no extra runtime dependencies)
        shell: pwsh
        run: ./build-standalone.ps1 -SkipSelfExtract

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install only Python test driver
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.58.0'
          test -x /usr/bin/chromium
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Record and decode WebM with a synthetic microphone
        shell: bash
        run: |
          python tests/recording-ux-smoke.py \
            --html dist/index.html \
            --output smoke-output \
            --chromium /usr/bin/chromium

      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pause-and-tell-browser-smoke
          path: smoke-output/
          if-no-files-found: ignore
          retention-days: 7
